<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradChiTrang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <filter id="shadowChiTrang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EC4899" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGradChiTrang)" />
  <circle cx="200" cy="200" r="160" fill="#FFF" opacity="0.6"/>
  <!-- Chi Trang portrait illustration -->
  <g filter="url(#shadowChiTrang)">
    <!-- Long straight elegant dark hair -->
    <path d="M110 180 C105 70 295 70 290 180 C295 280 280 340 265 370 C240 330 220 270 200 270 C180 270 160 330 135 370 C120 340 105 280 110 180 Z" fill="#1C1917" />
    <!-- Clothes (chic lotus pink top) -->
    <path d="M120 380 C120 300 155 270 200 270 C245 270 280 300 280 380 Z" fill="#EC4899" />
    <path d="M180 270 C190 290 210 290 220 270 Z" fill="#FDF2F8" />
    <!-- Neck -->
    <rect x="189" y="238" width="22" height="40" rx="10" fill="#FFD8C9" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="54" ry="64" fill="#FFE5D9" />
    <!-- Bangs -->
    <path d="M145 160 C160 125 240 125 255 160 C240 138 220 132 200 142 C180 132 160 138 145 160 Z" fill="#1C1917" />
    <!-- Cute hair clip -->
    <rect x="142" y="145" width="18" height="6" rx="3" fill="#F472B6" transform="rotate(-15 151 148)" />
    <!-- Rosy cheeks -->
    <ellipse cx="165" cy="196" rx="11" ry="6" fill="#F472B6" opacity="0.6" />
    <ellipse cx="235" cy="196" rx="11" ry="6" fill="#F472B6" opacity="0.6" />
    <!-- Sweet eyes -->
    <circle cx="174" cy="176" r="4.5" fill="#1C1917" />
    <circle cx="226" cy="176" r="4.5" fill="#1C1917" />
    <circle cx="172" cy="174" r="1.5" fill="#FFF" />
    <circle cx="224" cy="174" r="1.5" fill="#FFF" />
    <!-- Elegant bright smile -->
    <path d="M187 206 Q200 220 213 206" stroke="#BE185D" stroke-width="2.8" stroke-linecap="round" fill="none" />
  </g>
</svg>
