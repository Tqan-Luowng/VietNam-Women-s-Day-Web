<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMoChanh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <filter id="shadowMoChanh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGradMoChanh)" />
  <circle cx="200" cy="200" r="160" fill="#FFF" opacity="0.6"/>
  <!-- Mo Chanh portrait illustration -->
  <g filter="url(#shadowMoChanh)">
    <!-- Ponytail / Energetic hair -->
    <path d="M125 180 C115 85 285 85 275 180 C278 240 260 270 248 275 C230 250 170 250 152 275 C140 270 122 240 125 180 Z" fill="#1F2937" />
    <!-- High side ponytail -->
    <path d="M260 120 C310 110 330 160 300 210 C280 200 270 160 260 120 Z" fill="#1F2937" />
    <circle cx="265" cy="125" r="9" fill="#10B981" />
    <!-- Clothes (emerald green fresh top) -->
    <path d="M115 380 C115 298 150 268 200 268 C250 268 285 298 285 380 Z" fill="#10B981" />
    <path d="M180 268 C190 288 210 288 220 268 Z" fill="#ECFDF5" />
    <!-- Neck -->
    <rect x="188" y="238" width="24" height="40" rx="10" fill="#FFD8C9" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="56" ry="66" fill="#FFE5D9" />
    <!-- Bangs -->
    <path d="M142 165 C158 130 242 130 258 165 C242 142 220 136 200 146 C180 136 158 142 142 165 Z" fill="#1F2937" />
    <!-- Rosy cheeks -->
    <ellipse cx="165" cy="196" rx="12" ry="7" fill="#34D399" opacity="0.4" />
    <ellipse cx="235" cy="196" rx="12" ry="7" fill="#34D399" opacity="0.4" />
    <!-- Lively twinkling eyes -->
    <circle cx="174" cy="176" r="4.5" fill="#1F2937" />
    <circle cx="226" cy="176" r="4.5" fill="#1F2937" />
    <circle cx="172" cy="174" r="1.5" fill="#FFF" />
    <circle cx="224" cy="174" r="1.5" fill="#FFF" />
    <!-- Radiant lively smile -->
    <path d="M185 205 Q200 222 215 205" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
