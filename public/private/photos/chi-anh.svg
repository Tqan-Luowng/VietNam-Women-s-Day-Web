<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradChiAnh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    <filter id="shadowChiAnh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGradChiAnh)" />
  <circle cx="200" cy="200" r="160" fill="#FFF" opacity="0.6"/>
  <!-- Chi Anh portrait illustration -->
  <g filter="url(#shadowChiAnh)">
    <!-- Modern chic short lob hair -->
    <path d="M120 175 C112 80 288 80 280 175 C284 250 265 290 250 295 C230 260 170 260 150 295 C135 290 116 250 120 175 Z" fill="#292524" />
    <!-- Clothes (cyan teal radiant top) -->
    <path d="M115 380 C115 298 150 268 200 268 C250 268 285 298 285 380 Z" fill="#06B6D4" />
    <path d="M180 268 C190 288 210 288 220 268 Z" fill="#ECFEFF" />
    <!-- Neck -->
    <rect x="188" y="238" width="24" height="40" rx="10" fill="#FFD8C9" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="#FFE5D9" />
    <!-- Bangs -->
    <path d="M142 162 C158 130 242 130 258 162 C242 142 220 136 200 145 C180 136 158 142 142 162 Z" fill="#292524" />
    <!-- Small star hair pin -->
    <circle cx="250" cy="145" r="6" fill="#FBBF24" />
    <!-- Rosy cheeks -->
    <ellipse cx="165" cy="196" rx="11" ry="6" fill="#22D3EE" opacity="0.4" />
    <ellipse cx="235" cy="196" rx="11" ry="6" fill="#22D3EE" opacity="0.4" />
    <!-- Radiant smiling eyes -->
    <circle cx="174" cy="176" r="4.5" fill="#292524" />
    <circle cx="226" cy="176" r="4.5" fill="#292524" />
    <circle cx="172" cy="174" r="1.5" fill="#FFF" />
    <circle cx="224" cy="174" r="1.5" fill="#FFF" />
    <!-- Sunshine radiant smile -->
    <path d="M185 205 Q200 222 215 205" stroke="#0891B2" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
