<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FB7185" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGrad3)" />
  <circle cx="200" cy="200" r="160" fill="#FFF" opacity="0.6"/>
  <!-- Di Ut portrait illustration - short bob hair & glasses, chic -->
  <g filter="url(#shadow3)">
    <!-- Bob hair back -->
    <path d="M125 180 C125 90 275 90 275 180 C275 240 260 260 250 260 C230 240 170 240 150 260 C140 260 125 240 125 180 Z" fill="#2E1C2B" />
    <!-- Clothes -->
    <path d="M115 380 C115 305 150 275 200 275 C250 275 285 305 285 380 Z" fill="#FB7185" />
    <!-- Neck -->
    <rect x="188" y="240" width="24" height="40" rx="10" fill="#FFD8C9" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="58" ry="68" fill="#FFE5D9" />
    <!-- Cute stylish bob bangs -->
    <path d="M135 170 C145 130 180 125 200 138 C220 125 255 130 265 170 C250 145 220 140 200 150 C180 140 150 145 135 170 Z" fill="#2E1C2B" />
    <!-- Modern chic round glasses -->
    <circle cx="175" cy="178" r="18" fill="none" stroke="#E11D48" stroke-width="3" />
    <circle cx="225" cy="178" r="18" fill="none" stroke="#E11D48" stroke-width="3" />
    <path d="M193 178 L207 178" stroke="#E11D48" stroke-width="3" />
    <!-- Eyes inside glasses smiling -->
    <path d="M167 178 Q175 172 183 178" stroke="#2E1C2B" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M217 178 Q225 172 233 178" stroke="#2E1C2B" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Blush -->
    <ellipse cx="155" cy="202" rx="12" ry="7" fill="#FB7185" opacity="0.5" />
    <ellipse cx="245" cy="202" rx="12" ry="7" fill="#FB7185" opacity="0.5" />
    <!-- Big joyful smile -->
    <path d="M185 208 Q200 226 215 208" stroke="#E11D48" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
