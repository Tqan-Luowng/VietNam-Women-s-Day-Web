<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBaNgoai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="shadowBN" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGradBaNgoai)" />
  <circle cx="200" cy="200" r="160" fill="#FFF" opacity="0.6"/>
  <!-- Grandmother portrait illustration - gentle, silver-touched bun, warm smile -->
  <g filter="url(#shadowBN)">
    <!-- Hair back (silver hair) -->
    <path d="M120 180 C120 80 280 80 280 180 C280 240 265 270 250 280 C230 250 170 250 150 280 C135 270 120 240 120 180 Z" fill="#9CA3AF" />
    <!-- Clothes (cozy warm cardigan) -->
    <path d="M110 380 C110 295 150 265 200 265 C250 265 290 295 290 380 Z" fill="#D97706" />
    <path d="M175 265 C185 285 215 285 225 265 Z" fill="#FEF3C7" />
    <!-- Neck -->
    <rect x="185" y="235" width="30" height="40" rx="10" fill="#FFD8C9" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="60" ry="68" fill="#FFE5D9" />
    <!-- Silver Bun on top with warm floral pin -->
    <circle cx="200" cy="95" r="34" fill="#9CA3AF" />
    <circle cx="200" cy="95" r="26" fill="#D1D5DB" />
    <circle cx="230" cy="95" r="10" fill="#F59E0B" />
    <circle cx="230" cy="95" r="5" fill="#DC2626" />
    <!-- Gentle smiling eyes with crow's feet wrinkles (kind wisdom) -->
    <path d="M165 175 Q175 168 185 175" stroke="#4B5563" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M215 175 Q225 168 235 175" stroke="#4B5563" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M158 173 L153 171 M158 177 L153 179" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <path d="M242 173 L247 171 M242 177 L247 179" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy kind cheeks -->
    <ellipse cx="160" cy="195" rx="12" ry="7" fill="#F87171" opacity="0.5" />
    <ellipse cx="240" cy="195" rx="12" ry="7" fill="#F87171" opacity="0.5" />
    <!-- Warm loving smile -->
    <path d="M185 205 Q200 222 215 205" stroke="#991B1B" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Pearl necklace -->
    <circle cx="180" cy="265" r="4" fill="#FFF" />
    <circle cx="190" cy="269" r="4" fill="#FFF" />
    <circle cx="200" cy="270" r="4.5" fill="#FFF" />
    <circle cx="210" cy="269" r="4" fill="#FFF" />
    <circle cx="220" cy="265" r="4" fill="#FFF" />
  </g>
</svg>
