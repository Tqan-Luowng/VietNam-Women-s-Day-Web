<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6EE" />
      <stop offset="100%" stop-color="#FFD1DC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E8799A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" fill="#FFF" opacity="0.6"/>
  <!-- Mother portrait illustration -->
  <g filter="url(#shadow)">
    <!-- Hair back -->
    <path d="M120 180 C120 80 280 80 280 180 C280 230 270 270 260 290 C240 250 160 250 140 290 C130 270 120 230 120 180 Z" fill="#4A303A" />
    <!-- Clothes -->
    <path d="M110 380 C110 300 150 270 200 270 C250 270 290 300 290 380 Z" fill="#E8799A" />
    <path d="M175 270 C185 290 215 290 225 270 Z" fill="#FFCCD8" />
    <!-- Neck -->
    <rect x="185" y="240" width="30" height="40" rx="10" fill="#FFD8C9" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="60" ry="70" fill="#FFE5D9" />
    <!-- Hair front / bangs -->
    <path d="M140 160 C150 130 180 120 200 135 C220 120 250 130 260 160 C250 140 220 130 200 145 C180 130 150 140 140 160 Z" fill="#4A303A" />
    <!-- Bun on hair -->
    <circle cx="200" cy="95" r="32" fill="#4A303A" />
    <path d="M185 95 Q200 80 215 95" stroke="#FFB6C8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="160" cy="195" rx="12" ry="7" fill="#FFAEC0" opacity="0.6" />
    <ellipse cx="240" cy="195" rx="12" ry="7" fill="#FFAEC0" opacity="0.6" />
    <!-- Eyes - smiling curves -->
    <path d="M165 175 Q175 168 185 175" stroke="#4A303A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M215 175 Q225 168 235 175" stroke="#4A303A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Gentle warm smile -->
    <path d="M185 205 Q200 222 215 205" stroke="#B84260" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Flower brooch -->
    <circle cx="245" cy="300" r="10" fill="#FFE27A" />
    <circle cx="245" cy="300" r="5" fill="#E8799A" />
  </g>
  <!-- Sparkles -->
  <path d="M80 100 Q90 100 90 90 Q90 100 100 100 Q90 100 90 110 Q90 100 80 100" fill="#FFB6C8" />
  <path d="M310 120 Q320 120 320 110 Q320 120 330 120 Q320 120 320 130 Q320 120 310 120" fill="#FFCCD8" />
</svg>
